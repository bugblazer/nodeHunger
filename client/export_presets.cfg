html/head_include="<style>
#wake-notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;max-width:min(92vw,480px);padding:12px 16px;border-radius:10px;background:rgba(20,20,24,.92);border:1px solid #444;color:#eee;font:14px/1.4 'Noto Sans',Arial,sans-serif;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);display:none}
#wake-notice strong{color:#ffb347}
</style>
<script>
// The game server runs on a free host that sleeps when nobody is playing and takes
// 20-50 s to wake. Start waking it while the game itself is still downloading, and
// tell the player what's happening instead of leaving them on a silent screen.
(function () {
  var HEALTH = 'https://node-hunger-server.onrender.com/health';
  var started = Date.now(), awake = false, box;
  function markAwake() {
    awake = true;
    if (box) { box.style.display = 'none'; }
  }
  // Also count the game's own connection: once its WebSocket opens, the server is
  // up, even if /health is unreachable (e.g. an older server without it).
  var NativeWebSocket = window.WebSocket;
  if (NativeWebSocket) {
    var Patched = function (url, protocols) {
      var ws = protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols);
      ws.addEventListener('open', markAwake);
      return ws;
    };
    Patched.prototype = NativeWebSocket.prototype;
    ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { Patched[k] = NativeWebSocket[k]; });
    window.WebSocket = Patched;
  }
  function show(html) {
    if (!box) { box = document.getElementById('wake-notice'); }
    if (!box) { return; }
    box.innerHTML = html;
    box.style.display = 'block';
  }
  function tick() {
    if (awake) { return; }
    var s = Math.round((Date.now() - started) / 1000);
    show(s < 90
      ? '<strong>Waking up the game server…</strong><br>It sleeps when nobody is playing. This takes up to a minute (' + s + 's).'
      : '<strong>Still waking the server…</strong><br>If nothing happens soon, refresh the page.');
    setTimeout(tick, 1000);
  }
  function ping() {
    if (awake) { return; }
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, 15000);
    fetch(HEALTH, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) { throw new Error(r.status); }
        markAwake();
      })
      .catch(function () { clearTimeout(timer); setTimeout(ping, 3000); });
  }
  ping();
  // Only show the notice if the server doesn't answer straight away.
  setTimeout(function () { if (!awake) { tick(); } }, 1500);
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.createElement('div');
    el.id = 'wake-notice';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  });
})();
</script>"
